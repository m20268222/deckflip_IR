name: Poll integration check

on:
  push:
    branches: [main]
    paths:
      - index.html
      - deck.html
      - supabase/**
      - tests/**
      - .github/workflows/poll-integration-check.yml
  pull_request:
    paths:
      - index.html
      - deck.html
      - supabase/**
      - tests/**
      - .github/workflows/poll-integration-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/verify-poll-integration.mjs
